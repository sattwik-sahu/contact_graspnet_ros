/**:
  ros__parameters:
    model_config: model.yaml
    checkpoint_dir: third_party/contact_graspnet_pytorch/checkpoints/contact_graspnet/checkpoints
    device: cuda

    z_range: [0.2, 1.8]
    local_regions: true
    filter_grasps: true
    skip_border_objects: false
    segmap_id: 0
    max_segments: 4

    forward_passes: 1
    first_thres: 0.15
    second_thres: 0.15
    num_samples: 200
    max_farthest_points: 150
    seed: 0

    service_timeout_s: 5.0
    mask_mode: labels
    depth_scale: 0.001

    # Output frame. Empty keeps the depth/camera_info frame. A request may
    # override this per call via GenerateGrasps.target_frame.
    target_frame: ""

    # Static transform from the network's gripper frame (+X closing, +Z
    # approach, origin at the flange) to your downstream tool/EE frame.
    # Identity default keeps the native Contact-GraspNet convention.
    tcp_offset: [0.0, 0.0, 0.0]   # metres, in the network gripper frame
    tcp_rpy: [0.0, 0.0, 0.0]      # radians, fixed-axis roll/pitch/yaw
    tf_timeout_s: 0.2
