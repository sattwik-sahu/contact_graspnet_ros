title: Contact-GraspNet ROS 2
description: >-
  A modular, Dockerized ROS 2 wrapper for Contact-GraspNet. Depth, camera
  intrinsics and an optional segmentation mask in; typed 6-DoF grasp proposals
  out.

url: "https://sattwik-sahu.github.io"
baseurl: "/contact_graspnet_ros"
repository: sattwik-sahu/contact_graspnet_ros

theme: just-the-docs
lang: en
permalink: pretty
markdown: kramdown
highlighter: rouge

search_enabled: true
heading_anchors: true
color_scheme: light
back_to_top: true

aux_links:
  "GitHub Repository": https://github.com/sattwik-sahu/contact_graspnet_ros
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: https://github.com/sattwik-sahu/contact_graspnet_ros
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

footer_content: >-
  Contact-GraspNet ROS 2 wrapper. Wrapper code Apache-2.0; upstream model and
  weights retain the NVIDIA license.

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
  - _site
