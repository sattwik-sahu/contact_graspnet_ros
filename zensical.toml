# Zensical configuration for the Contact-GraspNet ROS 2 documentation.
# Migrated from mkdocs.yml. The `modern` variant is Zensical's default theme;
# use `classic` to restore the former Material for MkDocs appearance.

[project]
site_name = "Contact-GraspNet ROS 2"
site_description = "A modular, Dockerized ROS 2 wrapper for Contact-GraspNet. Depth, camera intrinsics and an optional segmentation mask in; typed 6-DoF grasp proposals out."
site_url = "https://sattwik-sahu.github.io/contact_graspnet_ros/"
repo_url = "https://github.com/sattwik-sahu/contact_graspnet_ros"
repo_name = "sattwik-sahu/contact_graspnet_ros"
edit_uri = "edit/main/docs/"
copyright = "Contact-GraspNet ROS 2 wrapper. Wrapper code Apache-2.0."

nav = [
  { "Home" = "index.md" },
  { "Guide" = [
    { "Getting Started" = "getting-started.md" },
    { "Configuration" = "configuration.md" },
    { "Grasp Frames & Downstream Planning" = "grasp-frames.md" },
    { "Docker & Docker Compose" = "docker.md" },
    { "Deployment" = "deployment.md" },
    { "Troubleshooting" = "troubleshooting.md" },
  ] },
  { "Reference" = [
    { "Architecture" = "architecture.md" },
    { "ROS Interfaces" = "ros-interfaces.md" },
    { "Inference Contract" = "inference-contract.md" },
    { "Design / PRD" = "design.md" },
  ] },
  { "Project" = [
    { "Contributing" = "contributing.md" },
    { "License" = "license.md" },
  ] },
]

[project.theme]
variant = "modern"
language = "en"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.action.edit",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.tabbed.alternate_style = true
pymdownx.snippets = {}
